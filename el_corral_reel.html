function build(b){
  const m=T(b,20,.7),c=mx(1330,2300,T(b,20,.6)),s21=T(b,21,.7),s22=T(b,22,.7),u=TI(b,23,.6);

  const o={TB:{dy:-420*s21},BB:{dy:420*s21},FR:{k:mx(1,1.55,s22)}};
  LET.forEach((n,i)=>o[n]={dx:(i-3.5)*60*s22});

}
function stamp(b){
  const wy=H*T(b,24,.5);if(b>=24){ctx.fillStyle=C.red;ctx.fillRect(0,wy,W,H-wy)}
  const pk=1+.05*pulse(b,24)+.05*pulse(b,25)+.04*pulse(b,26.4);
  const spin=T(b,27,.8),ay=b>=27.8?0:rad(360)*spin;
  const g={k:pk,ay},o={FR:{k:mx(2.4,1,T(b,24,.25))},TB:{dy:mx(-1300,0,T(b,25,.3))},BB:{dy:mx(1300,0,T(b,25,.3))}};
  lockup(g,{},o,n=>{if(b<24.0)return true;if((n==='TB'||n==='BB')&&b<25)return true;return LET.includes(n)&&b<27});
  // letras: estampado una a una (b26)
  if(b<27)LET.forEach((n,i)=>{const t=26+i*.05;if(b>=t){const q=hc(n);A(n,q.x,q.y,mx(2.2,1,T(b,t,.14)))}});
}
function ending(b){
  const pk=1+.04*pulse(b,28)+.03*pulse(b,29);lockup({k:pk,ay:0});
}
function scene(b){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  if(b<4){hook(b);return}
  if(b<8){kinetic(b);return}
  if(b<12){morph(b);return}
  if(b<16){depth(b);return}
  if(b<20){ui(b);return}
  if(b<24){build(b);return}
  if(b<28){stamp(b);return}
  ending(b);
}

};
